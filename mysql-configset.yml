apiVersion: v1
kind: ConfigMap
metadata:
  name: mysql-config
data:
  primary.cnf: |
    [mysqld]
    log-bin           # Enable binary logging for replication
    gtid_mode=ON      # Recommended for easier failover
    enforce_gtid_consistency=ON
  replica.cnf: |
    [mysqld]
    super-read-only   # Prevents accidental writes on replicas
